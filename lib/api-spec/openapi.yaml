openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Smart Kisan Bharat API contract
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Service health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]